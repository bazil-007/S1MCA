<html>
    <head>
        <title>booking</title>

    <body style="background-color: lightblue;">
        <h1 align="center">PARADISE RESORT</h1>
        <hr>
             <header style="display: flex; justify-content: space-between; align-items: center;">
  <p>Useful links</p>
  <p>
    <a href="location.html">Location</a>
    <a href="contact.html">Contact us</a>

  </p>
</header>
        <hr>
        <br>
        <br>
        <h2>Book Your Holiday Now</h2>
        <form action="#">
            Name:
            <input type="text" name="name"><br><br>
            E-mail:
            <input type="email" name="email"><br><br>
            Phone number:
            <input type="tel" name="number"><br><br>
            Checkin date:
            <input type="date" name="checkin"><br><br>
            checkout date:
            <input type="date" name="checkout"> <br><br>
            Number of guest:
            <input type="number" name="guest"><br><br>
            Room type: <br>
            <select name="roomtype">
                <option>Deluxe Room</option>
                <option>Family Room</option>
                <option>Suite</option>
            </select>
            <br><br>
            Gender:
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>
            Facilites required:
            <input type="checkbox" name="fac">pool
            <input type="checkbox" name="fac">camp fire
            <br><br>
            Special Request:
            <textarea name="sr"row="5" cols="30"></textarea>
            <br><br>
            ID proof:
            <input type="file" name="proof">
            <br><br>
            <input type="submit" value="Book now" name="submit">
            <input type="reset" value="reset">
        </form>
        <hr>
        <hr>
